name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q Win10SimApk.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: Win10SimApk
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Win10Sim-APK
          path: Win10SimApk/app/build/outputs/apk/debug/app-debug.apk
